<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Legende von Kevin dem Langen</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e8dcc5;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #game-container {
            background-color: #2a2a2a;
            border: 2px solid #8b7355;
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
        }
        h1 {
            color: #d4af37;
            font-size: 1.8em;
            margin-bottom: 20px;
            border-bottom: 1px solid #8b7355;
            padding-bottom: 10px;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            background-color: #4a0e0e;
            color: #d4af37;
            border: 1px solid #8b7355;
            padding: 15px 20px;
            font-size: 1.1em;
            font-family: 'Georgia', serif;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #661414;
            transform: scale(1.02);
        }
        .highlight {
            color: #d4af37;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1 id="story-title">Titel</h1>
    <p id="story-text">Text lädt...</p>
    <div id="choices" class="btn-container">
        <!-- Buttons werden hier generiert -->
    </div>
</div>

<script>
    const storyData = {
        start: {
            title: "Die Legende des Recken 'Kevin der Lange'",
            text: "Ein Schelmenmärchen anlässlich des 30. Wiegenfestes. Bist du bereit, den Bund des Heiligen Gerstensaftes auf seiner bisher wichtigsten Queste zu begleiten?",
            choices: [
                { text: "Tretet ein in die Taverne und beginnt die Geschichte!", target: "prolog" }
            ]
        },
        prolog: {
            title: "Prolog: Der Schauer der Dreißig",
            text: "Düstere Kunde geht um im Reiche des Nordens: Der edle Recke <span class='highlight'>Kevin der Lange</span> steht kurz davor, die gefürchtete Schwelle der Drei Dekaden zu überschreiten.<br><br>Schleichender Haarverfall, zunehmende Geräusche beim Hinsetzen und der 2-Tage-Kater drohen! Doch seine Gefährten Henni, Fabi und Maggi schreiten ein: 'Wir entführen ihn an einen Ort der vollkommenen Entschleunigung!'",
            choices: [
                { text: "Helft den Gefährten, den Streitwagen zu beladen!", target: "station1" }
            ]
        },
        station1: {
            title: "Station 1: Der Aufbruch ins Unbekannte",
            text: "Um das gelobte Exil zu erreichen, muss gepackt werden. Der Streitwagen muss bis unters Dach mit heiligem Proviant beladen werden. Was nehmen die Recken mit?",
            choices: [
                { text: "Bergeweise Grillgut, edelste Tropfen und geheiligte Klappstühle der Gemütlichkeit.", target: "station2" },
                { text: "Grünen Tee, eine Yoga-Matte und vegane Reiswaffeln.", target: "station1_fail" }
            ]
        },
        station1_fail: {
            title: "Ein Frevel am Bund!",
            text: "Der Gott des Gerstensaftes blickt zornig auf euch herab. Kevin beginnt sofort am Kopf kahl zu werden und sein Knie knackt ohrenbetäubend. Das war die falsche Wahl!",
            choices: [
                { text: "Schnell zurück und richtig packen!", target: "station1" }
            ]
        },
        station2: {
            title: "Station 2: Das tückische Gewässer",
            text: "Die Reise beginnt. Doch schon bald versperren geheimnisumwitterte Fluten den Weg. Ein alter Weiser fragt euch nach dem Namen des Sees. 'Hüte deine Zunge!', warnten die Pergamente.<br><br>Wie antwortet ihr?",
            choices: [
                { text: "Wir möchten über den edlen Zotzensee!", target: "station3" },
                { text: "Ist das hier der Fotzensee?", target: "station2_fail" }
            ]
        },
        station2_fail: {
            title: "Die Macht des falschen Buchstabens",
            text: "Du hast ein 'Z' durch ein garstig-ordinäres 'F' ersetzt! Das idyllische Naturdenkmal verwandelt sich augenblicklich in den berüchtigtsten Tümpel des gesamten Ostreichs. Die Schande ist unermesslich!",
            choices: [
                { text: "Zähne zusammenbeißen und es nochmal versuchen!", target: "station2" }
            ]
        },
        station3: {
            title: "Station 3: Das schlüpfrige Dickicht",
            text: "Kaum ist diese Peinlichkeit umschifft, müsst ihr den nächsten Wegpunkt in das magische Navigationsgerät eintragen. Das Ziel ist der Mössensee. Die Chroniken warnen vor der Trunkenheit des Schreiberlings!",
            choices: [
                { text: "Mich zieht es mit aller Kraft zum Mösensee!", target: "station3_fail" },
                { text: "Ich halte das zweite 's' mit beiden Händen fest: M-Ö-S-S-E-N-S-E-E!", target: "ziel" }
            ]
        },
        station3_fail: {
            title: "Ein Pfuhl der Unzucht",
            text: "Wehe dir! Durch das fehlende 's' wird aus dem ehrbaren Gewässer ein feucht-schlüpfriger Pfuhl. Maggi, Henni und Fabi lachen sich schlapp, aber der Streitwagen steckt im Schlamm fest.",
            choices: [
                { text: "Korrektur lesen und nochmal tippen!", target: "station3" }
            ]
        },
        ziel: {
            title: "Das Gelobte Land",
            text: "Die Nebel lichten sich. Vor euch erstrahlt das sagenumwobene Schloss der Entspannung: <span class='highlight'>Das OCCALA PREMIUM am Woblitzsee</span>.<br><br>Keine schnöde Bretterbude, sondern eine fürstliche Residenz für gestandene Männer im Zenit ihrer Schaffenskraft. Die Anker werden geworfen!",
            choices: [
                { text: "Das oberste Gesetz des Bundes vollstrecken!", target: "epilog" }
            ]
        },
        epilog: {
            title: "Einladung zum Männer-Urlaub",
            text: "Man wird vielleicht 30 – aber erwachsen werden müssen wir noch lange nicht!<br><br><span class='highlight'>Lieber Kevin,</span><br>gut 14 Jahre Freundschaft sind ein starkes Fundament. Wir schenken dir ein ganzes Wochenende Männer-Urlaub: See, Grill, Bier, die besten Kumpels und standesgemäßes Residieren im Occala Premium.<br><br>Pack die Badehose ein für den: <span class='highlight'>25.06. - 27.06.2027</span>!<br><br>In ewiger Treue,<br>Deine Gefährten Henni, Fabi und Maggi",
            choices: [
                { text: "Die Legende von vorn beginnen", target: "start" },
                { text: "🐍 Zur nächsten Queste: Die Snake-Prüfung", url: "snake.html" },
                { text: "🏠 Zurück zum Hauptmenü", url: "index.html" }
            ]
        }
    };

    function renderStory(nodeKey) {
        const node = storyData[nodeKey];
        document.getElementById("story-title").innerHTML = node.title;
        document.getElementById("story-text").innerHTML = node.text;
        
        const choicesContainer = document.getElementById("choices");
        choicesContainer.innerHTML = "";
        
        node.choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.innerHTML = choice.text;
            btn.onclick = () => {
                if (choice.url) {
                    window.location.href = choice.url;
                } else {
                    renderStory(choice.target);
                }
            };
            choicesContainer.appendChild(btn);
        });
    }

    // Spiel starten
    renderStory("start");
</script>

</body>
</html>
